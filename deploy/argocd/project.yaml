# TrustNobody'nin Argo CD projesi. Bilerek dar tutuldu: yalnızca bu repo, yalnızca "trustnobody" namespace'i ve
# cluster geneli kaynak YOK. Yanlış bir manifest tesekkurco'ya, birikim'e ya da Traefik ayarına dokunamaz.
# Kurulumda bir kez elle uygulanır (bkz. deploy/README.md).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: trustnobody
  namespace: argocd
spec:
  description: TrustNobody, yüz yüze vampir-köylü oyunu
  sourceRepos:
    - https://github.com/onurozbk/TrustNobody.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: trustnobody
  # Namespace elle oluşturulur (secret'lar ondan önce gerekir); cluster kapsamlı kaynak yok.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
