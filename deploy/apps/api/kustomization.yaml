apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: trustnobody-api
      app.kubernetes.io/part-of: trustnobody
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
# Gizli olmayan çalışma zamanı ayarları (.NET config yolu, ":" yerine "__").
# Gizli olanlar (bağlantı cümlesi, JWT anahtarı) "trustnobody-api-secrets" secret'ında. Bkz. deploy/README.md
configMapGenerator:
  - name: trustnobody-api-config
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__MigrateOnStartup=true
      - RateLimiting__AuthPermitPerMinute=10
      - TZ=Europe/Istanbul
# newTag GitHub Actions (deploy.yml) tarafından her deploy'da commit SHA'sı ile güncellenir. Elle değiştirme.
images:
  - name: trustnobody-api
    newName: ghcr.io/onurozbk/trustnobody-api
    newTag: latest
