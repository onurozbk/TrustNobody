# trustnobody.tesekkur.co
#   /api/*   → trustnobody-api (REST)
#   /hubs/*  → trustnobody-api (SignalR WebSocket; Traefik WebSocket'i ek ayar olmadan geçirir)
#   /*       → trustnobody-web (nginx: Expo web statik dosyaları)
# Hepsi aynı origin olduğu için CORS gerekmez.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trustnobody
  annotations:
    # Sertifikayı k3s Traefik'i Let's Encrypt'ten alır; resolver tesekkurco reposundaki platform/traefik-config.yaml'da tanımlı
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: trustnobody-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - trustnobody.tesekkur.co
  rules:
    - host: trustnobody.tesekkur.co
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: trustnobody-api
                port:
                  name: http
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: trustnobody-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trustnobody-web
                port:
                  name: http
