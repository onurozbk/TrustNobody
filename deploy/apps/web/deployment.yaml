apiVersion: apps/v1
kind: Deployment
metadata:
  name: trustnobody-web
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx-unprivileged imajındaki "nginx" kullanıcısı
        runAsGroup: 101
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          image: trustnobody-web
          ports:
            - name: http
              containerPort: 8080
          env:
            # /api ve /hubs normalde Ingress'ten doğrudan API'ye gider. nginx'in kendi proxy'si de
            # aynı servise baksın ki imaj tek başına da tutarlı çalışsın.
            - name: API_UPSTREAM
              value: http://trustnobody-api:8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          # /healthz: nginx'in kendi cevabı (frontend/nginx.conf.template)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
