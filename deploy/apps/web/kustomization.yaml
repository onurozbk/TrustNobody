apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: trustnobody-web
      app.kubernetes.io/part-of: trustnobody
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# EXPO_PUBLIC_* değerleri imaj derlenirken JS'e gömülür (frontend/Dockerfile, deploy.yml build-args).
# newTag GitHub Actions (deploy.yml) tarafından her deploy'da commit SHA'sı ile güncellenir. Elle değiştirme.
images:
  - name: trustnobody-web
    newName: ghcr.io/onurozbk/trustnobody-web
    newTag: latest
