# ÖRNEK: gerçek şifreyle repoya koyma. Ya bu dosyayı kopyalayıp doldur:
#   cp secret.example.yaml secret.yaml && kubectl apply -f secret.yaml
# ya da doğrudan:
#   kubectl -n trustnobody create secret generic trustnobody-secrets \
#     --from-literal=ConnectionStrings__Default='Host=10.0.0.5;Port=5432;Database=trustnobody;Username=trustnobody;Password=...' \
#     --from-literal=Jwt__Key="$(openssl rand -base64 48)"
# Jwt__Key en az 32 karakter olmalı, yoksa API açılmaz. Değişirse herkesin oturumu düşer.
apiVersion: v1
kind: Secret
metadata:
  name: trustnobody-secrets
  namespace: trustnobody
type: Opaque
stringData:
  ConnectionStrings__Default: "Host=POSTGRES_HOST;Port=5432;Database=trustnobody;Username=trustnobody;Password=CHANGE_ME;Maximum Pool Size=20"
  Jwt__Key: "CHANGE_ME_EN_AZ_32_KARAKTER_RASTGELE_BIR_DEGER"
