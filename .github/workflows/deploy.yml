# Elle tetiklenir (Actions → Build & Deploy → Run workflow).
# İmajları derleyip ghcr.io'ya gönderir, deploy/k8s/kustomization.yaml'daki tag'i günceller.
# Argo CD bu commit'i görünce k3s'e deploy eder.
name: Build & Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # kustomization.yaml commit'i için
  packages: write # ghcr.io'ya push için

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: trustnobody-api
            context: backend
            file: backend/Dockerfile
          - name: trustnobody-web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update image tags
        run: |
          sed -i -E "s#^(\s*newTag:).*#\1 \"${GITHUB_SHA}\"#" deploy/k8s/kustomization.yaml
          git diff

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
